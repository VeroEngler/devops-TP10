name: PR Check - Validación de Calidad y Helm Chart

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Linting Python & Tests Unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install flake8 autopep8 pytest pytest-cov PyYAML

      - name: Formatear y verificar Python (Flake8)
        run: |
          if [ -d "backend" ]; then
            autopep8 --in-place --recursive --max-line-length=120 backend/
            flake8 backend/ --max-line-length=120
          elif [ -d "devops-portfolio/backend" ]; then
            autopep8 --in-place --recursive --max-line-length=120 devops-portfolio/backend/
            flake8 devops-portfolio/backend/ --max-line-length=120
          else
            echo "[INFO] No se encontró la carpeta backend/, omitiendo linting de código Python."
          fi

      - name: Ejecutar Pruebas Unitarias
        run: |
          if [ -d "backend/tests" ]; then
            pytest backend/tests/
          elif [ -d "devops-portfolio/backend/tests" ]; then
            pytest devops-portfolio/backend/tests/
          else
            echo "[INFO] No se encontraron pruebas unitarias, omitiendo pytest."
          fi

  helm-validation:
    name: Validar y Renderizar Helm Chart (Render First)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Validar estructura y metadata del Chart (Helm Lint)
        run: |
          helm lint devops-portfolio/

      - name: Renderizar Plantillas Go a YAML puro (Staging)
        run: |
          helm template test-staging ./devops-portfolio -f devops-portfolio/values-staging.yaml > manifests-rendered-staging.yaml

      - name: Renderizar Plantillas Go a YAML puro (Producción)
        run: |
          helm template test-prod ./devops-portfolio -f devops-portfolio/values-prod.yaml > manifests-rendered-prod.yaml

      - name: Validar Sintaxis YAML de Manifiestos Renderizados
        run: |
          python3 -c "
          import yaml
          for f in ['manifests-rendered-staging.yaml', 'manifests-rendered-prod.yaml']:
              with open(f) as stream:
                  docs = list(yaml.safe_load_all(stream))
                  print(f'[OK] {f}: {len(docs)} objetos de K8s procesados correctamente.')
          "

      - name: Publicar Artefacto con los Manifiestos Renderizados
        uses: actions/upload-artifact@v4
        with:
          name: manifiestos-k8s-renderizados
          path: |
            manifests-rendered-staging.yaml
            manifests-rendered-prod.yaml
          retention-days: 7
